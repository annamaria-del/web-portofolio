<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List | Anna</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800">

    <nav class="bg-white shadow-sm">
        <div class="max-w-6xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-3">

            <a href="index.html" class="text-2xl font-bold text-red-900">
                Anna.
            </a>

            <div class="flex flex-wrap gap-4 text-sm font-medium">

                <a href="index.html" class="hover:text-red-900">
                    Home
                </a>

                <a href="about.html" class="hover:text-red-900">
                    About
                </a>

                <a href="projects.html" class="hover:text-red-900">
                    Projects
                </a>

                <a href="contact.html" class="hover:text-red-900">
                    Contact
                </a>

                <a href="todo.html" class="text-red-900">
                    To-Do List
                </a>
<a href="calculator.html" class="hover:text-red-900">
    Calculator
</a>
            </div>
        </div>
    </nav>

    <main class="max-w-xl mx-auto px-6 py-16">

        <h1 class="text-4xl font-bold text-center mb-4">
            My To-Do List
        </h1>

        <p class="text-center text-slate-600 mb-8">
            Tambahkan tugas yang ingin kamu kerjakan.
        </p>

        <div class="bg-white rounded-2xl shadow-sm p-6">

            <div class="flex flex-col sm:flex-row gap-3 mb-6">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Contoh: Belajar HTML"
                    class="flex-1 min-w-0 border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-900"
                >

                <button
                    id="addTask"
                    class="bg-red-900 text-white px-5 py-3 rounded-lg hover:bg-red-950">
                    Tambah
                </button>

            </div>

            <ul id="taskList" class="space-y-3"></ul>

            <p id="emptyMessage" class="text-center text-slate-400 py-4">
                Belum ada tugas.
            </p>

        </div>

    </main>

    <footer class="bg-red-950 text-white text-center py-6">
        <p>&copy; 2026 Anna Maria.</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
