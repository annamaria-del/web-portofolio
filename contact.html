<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Anna</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-stone-50 text-slate-800">

    <nav class="bg-white shadow-sm">
        <div class="max-w-6xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-3">

            <a href="index.html" class="text-2xl font-bold text-red-900">
                Anna.
            </a>

            <div class="flex flex-wrap gap-4 text-sm font-medium">

                <a href="index.html" class="hover:text-red-900">Home</a>

                <a href="about.html" class="hover:text-red-900">About</a>

                <a href="projects.html" class="hover:text-red-900">Projects</a>

                <a href="contact.html" class="text-red-900">Contact</a>

                <a href="todo.html" class="hover:text-red-900">To-Do List</a>

                <a href="calculator.html" class="hover:text-red-900">Life Path</a>

            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-6 py-16">

        <h1 class="text-4xl font-bold text-center mb-4">
            Hubungi Saya
        </h1>

        <p class="text-center text-slate-600 mb-10">
            Silakan isi informasi berikut untuk menghubungi saya.
        </p>

        <div class="bg-white rounded-2xl shadow-sm p-8">

            <div class="mb-5">
                <label for="name" class="block font-medium mb-2">
                    Nama
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Masukkan nama kamu"
                    class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-900"
                >
            </div>

            <div class="mb-5">
                <label for="message" class="block font-medium mb-2">
                    Pesan
                </label>

                <textarea
                    id="message"
                    rows="5"
                    placeholder="Tulis pesan kamu..."
                    class="w-full border border-slate-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-red-900"
                ></textarea>
            </div>

            <button
                onclick="sendWhatsApp()"
                class="w-full bg-red-900 text-white py-3 rounded-lg hover:bg-red-950 transition">
                Kirim Pesan
            </button>

        </div>

    </main>

    <footer class="bg-red-950 text-white text-center py-6">
        <p>&copy; 2026 Anna Maria.</p>
    </footer>

    <script>
        function sendWhatsApp() {
            const name = document.getElementById("name").value.trim();
            const message = document.getElementById("message").value.trim();

            if (name === "" || message === "") {
                alert("Silakan isi nama dan pesan terlebih dahulu!");
                return;
            }

            const phoneNumber = "62XXXXXXXXXX";
            const text = `Halo Anna, saya ${name}.%0A%0A${message}`;

            window.open(`https://wa.me/${phoneNumber}?text=${text}`, "_blank");
        }
    </script>

</body>
</html>
